<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roomba vs Cats</title>
<style>
  html,body{margin:0;padding:0;background:#2b1d12;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{width:1280px;height:720px;image-rendering:auto;box-shadow:0 0 40px rgba(0,0,0,.6)}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
'use strict';
/* ROOMBA vs CATS — tiny one-button browser game.
   One prompt built this: robot vacuum drives on its own, tap to turn,
   suck dust, don't wake the cats, avoid cables, recharge at the dock. */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1280, H = 720;

// ---- seeded rng (fixed layout, reproducible shots) ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(7);

// ---- room ----
const DOCK = {x:78, y:642, r:62};
const FURN = [
  {x:60,  y:80,  w:230, h:96,  kind:'sofa'},   // sofa top-left
  {x:330, y:110, w:130, h:74,  kind:'table'},  // coffee table
  {x:980, y:70,  w:210, h:62,  kind:'shelf'},  // shelf top-right
  {x:1150,y:270, w:0,   h:0,   kind:'plant', r:42}, // plant right side
  {x:60,  y:520, w:150, h:70,  kind:'books'},  // low bookshelf
];
const RUG = {x:640, y:380, rx:270, ry:150};

// ---- cables (wavy polylines) ----
function wavy(x0,y0,x1,y1,n,amp){
  const pts=[];
  for(let i=0;i<=n;i++){
    const t=i/n;
    const px=x0+(x1-x0)*t, py=y0+(y1-y0)*t;
    const nx=-(y1-y0), ny=(x1-x0), len=Math.hypot(nx,ny)||1;
    const off=Math.sin(t*Math.PI*3)*amp;
    pts.push({x:px+nx/len*off, y:py+ny/len*off});
  }
  return pts;
}
const CABLES = [ wavy(470,120, 720,330, 14, 14), wavy(880,430, 1180,620, 14, 14) ];

// ---- cats ----
const CATS = [
  {name:'Mochi', color:'#e8913a', home:{x:880, y:210}, x:880, y:210, state:'sleep', speed:176, tx:0, ty:0},
  {name:'Milo',  color:'#8d99ae', home:{x:260, y:540}, x:260, y:540, state:'sleep', speed:176, tx:0, ty:0},
  {name:'Nori',  color:'#3d3d3d', home:{x:1080,y:540}, x:1080,y:540, state:'sleep', speed:176, tx:0, ty:0},
];

// ---- dust bunnies ----
function insideFurn(x,y,m){
  for(const f of FURN){
    if(f.kind==='plant'){ if(Math.hypot(x-f.x,y-f.y)<f.r+m) return true; }
    else if(x>f.x-m && x<f.x+f.w+m && y>f.y-m && y<f.y+f.h+m) return true;
  }
  return false;
}
function makeDust(){
  const list=[];
  let guard=0;
  while(list.length<14 && guard++<400){
    const x=90+rnd()*(W-180), y=90+rnd()*(H-180);
    if(Math.hypot(x-DOCK.x,y-DOCK.y)<130) continue;
    if(insideFurn(x,y,56)) continue;
    if(CATS.some(c=>Math.hypot(x-c.home.x,y-c.home.y)<95)) continue;
    if(list.some(d=>Math.hypot(x-d.x,y-d.y)<70)) continue;
    list.push({x,y,taken:false,ph:rnd()*6.28});
  }
  return list;
}

// ---- game state ----
let state='title';           // title | playing | gameover
let score=0, lives=3, battery=100, dustGot=0, combo=0, lastDustT=0;
let time=0, tangled=0, invuln=0, shake=0;
const roomba={x:DOCK.x+40, y:DOCK.y-10, heading:0, speed:152, r:24};
let dust=makeDust();
const particles=[], popups=[];
let turnFlash=0;

function resetGame(){
  score=0; lives=3; battery=100; dustGot=0; combo=0;
  roomba.x=DOCK.x+40; roomba.y=DOCK.y-10; roomba.heading=0;
  dust=makeDust();
  for(const c of CATS){ c.x=c.home.x; c.y=c.home.y; c.state='sleep'; }
  particles.length=0; popups.length=0; tangled=0; invuln=0;
}
function startGame(){ resetGame(); state='playing'; }
function loseLife(reason){
  if(invuln>0) return;
  lives--; shake=0.35;
  popups.push({x:roomba.x, y:roomba.y-40, text: reason==='cat'?'CAUGHT! -1 LIFE':'BATTERY DEAD! -1 LIFE', life:1.4, color:'#ff5d5d'});
  if(lives<=0){ state='gameover'; return; }
  roomba.x=DOCK.x+40; roomba.y=DOCK.y-10; roomba.heading=0;
  battery=100; invuln=2.2; tangled=0;
}
function turn(){
  if(state!=='playing') return;
  roomba.heading += Math.PI/4;
  turnFlash=0.45;
  for(let i=0;i<6;i++){
    particles.push({x:roomba.x, y:roomba.y+14, vx:(rnd()-0.5)*40, vy:20+rnd()*30, life:0.5, color:'#cfc4b0', r:3});
  }
}
function distToSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy||1;
  let t=((px-ax)*dx+(py-ay)*dy)/l2; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+dx*t), py-(ay+dy*t));
}

// ---- update ----
function update(dt){
  time+=dt;
  if(state!=='playing') return;
  if(invuln>0) invuln-=dt;
  if(turnFlash>0) turnFlash-=dt;
  if(shake>0) shake-=dt;

  // battery
  battery -= 1.0*dt;
  const dDock=Math.hypot(roomba.x-DOCK.x, roomba.y-DOCK.y);
  let charging=false;
  if(dDock < DOCK.r+10){
    battery=Math.min(100, battery+35*dt);
    charging=true;
  }
  if(battery<=0){ battery=0; loseLife('battery'); if(state!=='playing') return; }

  // move roomba (unless tangled)
  if(tangled>0){
    tangled-=dt;
  } else {
    roomba.x += Math.cos(roomba.heading)*roomba.speed*dt;
    roomba.y += Math.sin(roomba.heading)*roomba.speed*dt;
  }
  // walls
  if(roomba.x<roomba.r){ roomba.x=roomba.r; roomba.heading=Math.PI-roomba.heading; }
  if(roomba.x>W-roomba.r){ roomba.x=W-roomba.r; roomba.heading=Math.PI-roomba.heading; }
  if(roomba.y<roomba.r){ roomba.y=roomba.r; roomba.heading=-roomba.heading; }
  if(roomba.y>H-roomba.r){ roomba.y=H-roomba.r; roomba.heading=-roomba.heading; }
  roomba.heading=(roomba.heading+Math.PI*2)%(Math.PI*2);
  // furniture
  for(const f of FURN){
    if(f.kind==='plant'){
      const d=Math.hypot(roomba.x-f.x, roomba.y-f.y);
      if(d < roomba.r+f.r){
        const nx=(roomba.x-f.x)/d, ny=(roomba.y-f.y)/d;
        roomba.x=f.x+nx*(roomba.r+f.r); roomba.y=f.y+ny*(roomba.r+f.r);
        if(Math.abs(nx)>Math.abs(ny)) roomba.heading=Math.PI-roomba.heading;
        else roomba.heading=-roomba.heading;
      }
    } else {
      const cx=Math.max(f.x,Math.min(roomba.x,f.x+f.w));
      const cy=Math.max(f.y,Math.min(roomba.y,f.y+f.h));
      const dx=roomba.x-cx, dy=roomba.y-cy, d=Math.hypot(dx,dy);
      if(d<roomba.r){
        if(d===0){ roomba.y=f.y-roomba.r; roomba.heading=-roomba.heading; }
        else{
          const nx=dx/d, ny=dy/d;
          roomba.x=cx+nx*roomba.r; roomba.y=cy+ny*roomba.r;
          if(Math.abs(nx)>Math.abs(ny)) roomba.heading=Math.PI-roomba.heading;
          else roomba.heading=-roomba.heading;
        }
      }
    }
  }
  // cables — tangle
  if(tangled<=0){
    for(const cable of CABLES){
      for(let i=0;i<cable.length-1;i++){
        const a=cable[i], b=cable[i+1];
        if(distToSeg(roomba.x,roomba.y,a.x,a.y,b.x,b.y)<16){
          tangled=0.9; battery=Math.max(0,battery-4);
          popups.push({x:roomba.x, y:roomba.y-40, text:'TANGLED!', life:1.1, color:'#ffd166'});
          break;
        }
      }
      if(tangled>0) break;
    }
  }
  // dust
  for(const d of dust){
    if(d.taken) continue;
    if(Math.hypot(roomba.x-d.x, roomba.y-d.y)<36){
      d.taken=true; dustGot++;
      combo = (time-lastDustT<2.5) ? combo+1 : 1;
      lastDustT=time;
      const pts=10*Math.min(combo,5);
      score+=pts;
      popups.push({x:d.x, y:d.y-22, text:'+'+pts+(combo>1?'  x'+Math.min(combo,5):''), life:0.9, color:'#fff'});
      for(let i=0;i<10;i++){
        particles.push({x:d.x, y:d.y, vx:(rnd()-0.5)*90, vy:(rnd()-0.5)*90, life:0.6, color:'#d8d2c4', r:3});
      }
    }
  }
  // cats
  for(const c of CATS){
    if(c.state==='sleep'){
      if(invuln<=0 && Math.hypot(roomba.x-c.x, roomba.y-c.y)<46){
        c.state='chase';
        popups.push({x:c.x, y:c.y-44, text:'MEOW!!', life:1.2, color:'#ff8fa3'});
      }
    } else if(c.state==='chase'){
      const dx=roomba.x-c.x, dy=roomba.y-c.y, d=Math.hypot(dx,dy)||1;
      c.x+=dx/d*c.speed*dt; c.y+=dy/d*c.speed*dt;
      if(d<36){ loseLife('cat'); if(state!=='playing') return; c.state='return'; }
    } else if(c.state==='return'){
      const dx=c.home.x-c.x, dy=c.home.y-c.y, d=Math.hypot(dx,dy);
      if(d<8){ c.x=c.home.x; c.y=c.home.y; c.state='sleep'; }
      else { c.x+=dx/d*200*dt; c.y+=dy/d*200*dt; }
    }
  }
  // particles & popups
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=popups.length-1;i>=0;i--){
    const p=popups[i]; p.y-=28*dt; p.life-=dt;
    if(p.life<=0) popups.splice(i,1);
  }
}

// ---- drawing ----
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawRoom(){
  // wood floor planks
  ctx.fillStyle='#c98f5a'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,0.08)';
  for(let y=0;y<H;y+=72) ctx.fillRect(0,y,W,3);
  ctx.fillStyle='rgba(255,255,255,0.05)';
  for(let y=36;y<H;y+=72) ctx.fillRect(0,y,W,2);
  // rug
  ctx.fillStyle='#b3402e';
  ctx.beginPath(); ctx.ellipse(RUG.x,RUG.y,RUG.rx,RUG.ry,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#d95d43';
  ctx.beginPath(); ctx.ellipse(RUG.x,RUG.y,RUG.rx-26,RUG.ry-22,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#b3402e';
  ctx.beginPath(); ctx.ellipse(RUG.x,RUG.y,RUG.rx-60,RUG.ry-48,0,0,Math.PI*2); ctx.fill();
  // furniture
  for(const f of FURN){
    if(f.kind==='sofa'){
      ctx.fillStyle='#7a4a2b'; rr(f.x,f.y,f.w,f.h,14); ctx.fill();
      ctx.fillStyle='#96603a';
      rr(f.x+10,f.y+10,100,60,10); ctx.fill();
      rr(f.x+120,f.y+10,100,60,10); ctx.fill();
      ctx.fillStyle='#5d371f'; rr(f.x,f.y,f.w,20,8); ctx.fill();
    } else if(f.kind==='table'){
      ctx.fillStyle='#8a5a33'; rr(f.x,f.y,f.w,f.h,10); ctx.fill();
      ctx.fillStyle='#a9743f'; rr(f.x+8,f.y+8,f.w-16,f.h-16,8); ctx.fill();
      ctx.fillStyle='#e8e0d0'; ctx.beginPath(); ctx.arc(f.x+30,f.y+34,10,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#7fb069'; ctx.beginPath(); ctx.arc(f.x+92,f.y+36,12,0,Math.PI*2); ctx.fill();
    } else if(f.kind==='shelf'){
      ctx.fillStyle='#6b4423'; rr(f.x,f.y,f.w,f.h,8); ctx.fill();
      const cols=['#c1666b','#5b8c5a','#e0a458','#7d7bb3','#4f9da6'];
      for(let i=0;i<6;i++){ ctx.fillStyle=cols[i%5]; ctx.fillRect(f.x+12+i*32,f.y+12,20,38); }
    } else if(f.kind==='plant'){
      ctx.fillStyle='#b5654a'; ctx.beginPath(); ctx.arc(f.x,f.y+16,26,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#5b8c5a';
      for(let i=0;i<7;i++){
        const a=-Math.PI/2+(i-3)*0.42;
        ctx.beginPath(); ctx.ellipse(f.x+Math.cos(a)*22, f.y+Math.sin(a)*22-6, 12, 26, a, 0, Math.PI*2); ctx.fill();
      }
    } else if(f.kind==='books'){
      ctx.fillStyle='#4a3220'; rr(f.x,f.y,f.w,f.h,8); ctx.fill();
      const cols=['#c1666b','#e0a458','#4f9da6','#7d7bb3'];
      for(let i=0;i<8;i++){ ctx.fillStyle=cols[i%4]; ctx.fillRect(f.x+10+i*17,f.y+12,12,44); }
    }
  }
  // dock
  ctx.save();
  ctx.fillStyle='#3a3f4a'; rr(DOCK.x-DOCK.r, DOCK.y-DOCK.r, DOCK.r*2, DOCK.r*2, 16); ctx.fill();
  ctx.strokeStyle='#ffd166'; ctx.lineWidth=3; rr(DOCK.x-DOCK.r+6, DOCK.y-DOCK.r+6, DOCK.r*2-12, DOCK.r*2-12, 12); ctx.stroke();
  ctx.fillStyle='#ffd166'; ctx.font='bold 20px Arial'; ctx.textAlign='center';
  ctx.fillText('DOCK', DOCK.x, DOCK.y+34);
  ctx.font='26px Arial'; ctx.fillText('🔌', DOCK.x, DOCK.y+6);
  ctx.restore();
  // cables
  ctx.strokeStyle='#2b2b2b'; ctx.lineWidth=7; ctx.lineCap='round';
  for(const cable of CABLES){
    ctx.beginPath(); ctx.moveTo(cable[0].x,cable[0].y);
    for(let i=1;i<cable.length;i++) ctx.lineTo(cable[i].x,cable[i].y);
    ctx.stroke();
  }
  ctx.strokeStyle='#555'; ctx.lineWidth=2;
  for(const cable of CABLES){
    ctx.beginPath(); ctx.moveTo(cable[0].x,cable[0].y);
    for(let i=1;i<cable.length;i++) ctx.lineTo(cable[i].x,cable[i].y);
    ctx.stroke();
  }
}
function drawDust(){
  for(const d of dust){
    if(d.taken) continue;
    const wob=Math.sin(time*3+d.ph)*2;
    ctx.save(); ctx.translate(d.x, d.y+wob);
    ctx.fillStyle='rgba(120,110,95,0.9)';
    ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-8,4,7,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8,5,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-3,-2,2.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-2,2.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#333';
    ctx.beginPath(); ctx.arc(-3,-2,1.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-2,1.2,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
function drawCat(c){
  ctx.save(); ctx.translate(c.x, c.y);
  const chasing = c.state==='chase';
  // tail
  ctx.strokeStyle=c.color; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath();
  const wag = chasing ? Math.sin(time*14)*10 : Math.sin(time*2)*4;
  ctx.moveTo(-20, 8); ctx.quadraticCurveTo(-34, 16+wag, -26, -6+wag);
  ctx.stroke();
  // body (curled when sleeping, stretched when chasing)
  ctx.fillStyle=c.color;
  ctx.beginPath();
  if(chasing) ctx.ellipse(0, 0, 30, 18, 0, 0, Math.PI*2);
  else ctx.ellipse(0, 2, 26, 20, 0, 0, Math.PI*2);
  ctx.fill();
  // stripes
  ctx.strokeStyle='rgba(0,0,0,0.18)'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(-14,-12); ctx.lineTo(-14,12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(0,12); ctx.stroke();
  // head
  const hx = chasing ? 26 : 16, hy = chasing ? -4 : -12;
  ctx.fillStyle=c.color;
  ctx.beginPath(); ctx.arc(hx, hy, 15, 0, Math.PI*2); ctx.fill();
  // ears
  ctx.beginPath(); ctx.moveTo(hx-11, hy-10); ctx.lineTo(hx-14, hy-22); ctx.lineTo(hx-3, hy-13); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx+11, hy-10); ctx.lineTo(hx+14, hy-22); ctx.lineTo(hx+3, hy-13); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#ffb3c1';
  ctx.beginPath(); ctx.moveTo(hx-10, hy-12); ctx.lineTo(hx-12, hy-19); ctx.lineTo(hx-5, hy-13); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx+10, hy-12); ctx.lineTo(hx+12, hy-19); ctx.lineTo(hx+5, hy-13); ctx.closePath(); ctx.fill();
  if(chasing){
    // angry open eyes
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(hx-5, hy-2, 4.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx+6, hy-2, 4.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.arc(hx-4, hy-2, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx+7, hy-2, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#111'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(hx-10, hy-8); ctx.lineTo(hx-1, hy-5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx+11, hy-8); ctx.lineTo(hx+2, hy-5); ctx.stroke();
    ctx.fillStyle='#ff5d5d'; ctx.font='bold 22px Arial'; ctx.textAlign='center';
    ctx.fillText('!', hx, hy-28);
    // motion lines
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=3;
    for(let i=0;i<3;i++){
      ctx.beginPath(); ctx.moveTo(-26-i*8, -12+i*10); ctx.lineTo(-38-i*8, -12+i*10); ctx.stroke();
    }
  } else {
    // closed sleepy eyes
    ctx.strokeStyle='#222'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(hx-5, hy-2, 4, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx+6, hy-2, 4, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
    // Zzz
    ctx.fillStyle='#7fb3d5'; ctx.font='bold 16px Arial'; ctx.textAlign='left';
    const zb=Math.sin(time*2)*3;
    ctx.fillText('Z', hx+14, hy-22+zb);
    ctx.font='bold 12px Arial';
    ctx.fillText('z', hx+24, hy-32+zb);
  }
  ctx.restore();
}
function drawRoomba(){
  ctx.save();
  if(invuln>0 && Math.floor(time*10)%2===0) ctx.globalAlpha=0.45;
  if(shake>0) ctx.translate((rnd()-0.5)*8,(rnd()-0.5)*8);
  ctx.translate(roomba.x, roomba.y);
  ctx.rotate(roomba.heading);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(3, 5, 26, 24, 0, 0, Math.PI*2); ctx.fill();
  // body
  ctx.fillStyle='#3a3f4a';
  ctx.beginPath(); ctx.arc(0,0,24,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#565d6e';
  ctx.beginPath(); ctx.arc(0,0,19,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#7d8598';
  ctx.beginPath(); ctx.arc(-4,-2,11,0,Math.PI*2); ctx.fill();
  // bumper
  ctx.strokeStyle='#22242c'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.arc(0,0,23, -0.9, 0.9); ctx.stroke();
  // eyes
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(6,-7,4.6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(6,7,4.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(8,-7,2.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(8,7,2.2,0,Math.PI*2); ctx.fill();
  // brush bristles at back
  ctx.strokeStyle='#ffd166'; ctx.lineWidth=2.4;
  for(let i=-2;i<=2;i++){
    ctx.beginPath(); ctx.moveTo(-22, i*5); ctx.lineTo(-29, i*6); ctx.stroke();
  }
  // heading nose
  ctx.fillStyle='#ffd166';
  ctx.beginPath(); ctx.moveTo(24,0); ctx.lineTo(16,-6); ctx.lineTo(16,6); ctx.closePath(); ctx.fill();
  ctx.restore();
  // turn flash arrow
  if(turnFlash>0){
    ctx.save(); ctx.translate(roomba.x, roomba.y);
    ctx.strokeStyle='rgba(255,209,102,'+(turnFlash/0.45)+')'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(0,0,40, roomba.heading-Math.PI/4, roomba.heading); ctx.stroke();
    ctx.restore();
  }
}
function drawHUD(){
  ctx.fillStyle='rgba(20,16,12,0.78)';
  ctx.fillRect(0,0,W,54);
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle='#ffd166'; ctx.font='bold 24px Arial';
  ctx.fillText('SCORE  '+score, 20, 28);
  ctx.fillStyle='#fff'; ctx.font='20px Arial';
  ctx.fillText('DUST  '+dustGot+'/'+dust.length, 220, 28);
  // lives
  ctx.font='24px Arial';
  let hearts='';
  for(let i=0;i<3;i++) hearts += i<lives?'❤️':'🖤';
  ctx.fillText(hearts, 380, 28);
  // battery
  const bx=W-260, bw=170;
  ctx.fillStyle='#222'; rr(bx,16,bw,22,6); ctx.fill();
  const frac=Math.max(0,battery/100);
  ctx.fillStyle = battery>50 ? '#7ed957' : battery>25 ? '#ffd166' : '#ff5d5d';
  if(frac>0){ rr(bx+2,18,(bw-4)*frac,18,5); ctx.fill(); }
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; rr(bx,16,bw,22,6); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 18px Arial';
  ctx.fillText(Math.round(battery)+'%', bx+bw+10, 28);
  if(battery<25 && state==='playing'){
    ctx.fillStyle = Math.floor(time*4)%2===0 ? '#ff5d5d' : '#fff';
    ctx.font='bold 20px Arial'; ctx.textAlign='center';
    ctx.fillText('LOW BATTERY — GO TO THE DOCK!', W/2, 84);
  }
  if(tangled>0){
    ctx.fillStyle='#ffd166'; ctx.font='bold 22px Arial'; ctx.textAlign='center';
    ctx.fillText('TANGLED IN A CABLE!', W/2, 84);
  }
  const chasing=CATS.some(c=>c.state==='chase');
  if(chasing && state==='playing'){
    ctx.fillStyle='#ff8fa3'; ctx.font='bold 22px Arial'; ctx.textAlign='center';
    ctx.fillText('A CAT IS CHASING YOU!', W/2, 112);
  }
  ctx.textBaseline='alphabetic';
}
function drawTitle(){
  ctx.fillStyle='rgba(20,12,6,0.55)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ffd166'; ctx.font='bold 84px Arial';
  ctx.fillText('ROOMBA', W/2, 250);
  ctx.fillStyle='#ff8fa3'; ctx.font='bold 84px Arial';
  ctx.fillText('vs CATS', W/2, 340);
  ctx.fillStyle='#fff'; ctx.font='26px Arial';
  ctx.fillText('You are the little robot vacuum. Suck up the dust. Do NOT wake the cats.', W/2, 410);
  ctx.fillStyle='#ffd166'; ctx.font='bold 24px Arial';
  ctx.fillText('SPACE / TAP = turn    •    Cables tangle you    •    Dock recharges the battery', W/2, 460);
  ctx.fillStyle='#fff'; ctx.font='bold 30px Arial';
  if(Math.floor(time*2)%2===0) ctx.fillText('▶  Press SPACE or tap to start', W/2, 540);
}
function drawGameOver(){
  ctx.fillStyle='rgba(20,12,6,0.66)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ff5d5d'; ctx.font='bold 76px Arial';
  ctx.fillText('GAME OVER', W/2, 300);
  ctx.fillStyle='#fff'; ctx.font='30px Arial';
  ctx.fillText('Score: '+score+'    •    Dust sucked: '+dustGot+'/'+dust.length, W/2, 370);
  ctx.fillStyle='#ffd166'; ctx.font='bold 26px Arial';
  if(Math.floor(time*2)%2===0) ctx.fillText('Press R or tap to play again', W/2, 450);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  drawRoom();
  drawDust();
  for(const c of CATS) drawCat(c);
  drawRoomba();
  // particles
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/0.6);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  // popups
  ctx.textAlign='center'; ctx.font='bold 20px Arial';
  for(const p of popups){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
    ctx.fillStyle=p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha=1;
  drawHUD();
  if(state==='title') drawTitle();
  if(state==='gameover') drawGameOver();
}

// ---- input ----
function press(){
  if(state==='title') startGame();
  else if(state==='playing') turn();
  else if(state==='gameover') startGame();
}
window.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); press(); }
  if(e.code==='KeyR' && state==='gameover') startGame();
  if(e.code==='Enter' && state!=='playing') startGame();
});
cv.addEventListener('pointerdown', e=>{ e.preventDefault(); press(); });

// ---- shot staging (deterministic scenes for screenshots) ----
function stageShot(name){
  if(name==='title'){ state='title'; return; }
  state='playing';
  if(name==='dust'){
    score=40; dustGot=4; lives=3; battery=82;
    // roomba next to a dust cluster, a sleeping cat nearby
    const d0=dust.find(d=>!d.taken);
    roomba.x=d0.x-40; roomba.y=d0.y+30; roomba.heading=-0.5;
    // a couple of dust puffs right in front of the roomba
    dust[1].x=roomba.x+52; dust[1].y=roomba.y-14;
    dust[2].x=roomba.x+78; dust[2].y=roomba.y+22;
    CATS[0].x=roomba.x+180; CATS[0].y=roomba.y-70; CATS[0].state='sleep';
  }
  if(name==='chase'){
    score=120; dustGot=9; lives=2; battery=46;
    roomba.x=620; roomba.y=430; roomba.heading=0.3;
    CATS[0].x=540; CATS[0].y=470; CATS[0].state='chase';
    CATS[1].x=250; CATS[1].y=540; CATS[1].state='sleep';
    CATS[2].x=1080; CATS[2].y=540; CATS[2].state='sleep';
    for(let i=0;i<9;i++) dust[i].taken=true;
  }
}

// ---- debug hook for playtests ----
// NOTE: dust is re-created by resetGame(), so expose it (and cables) via
// getters — a plain reference would go stale after the first restart.
window.__roomba = {
  roomba, cats:CATS,
  get dust(){ return dust; },
  get cables(){ return CABLES; },
  get state(){ return state; },
  get score(){ return score; },
  get lives(){ return lives; },
  get dustGot(){ return dustGot; },
  get battery(){ return battery; },
  set battery(v){ battery=v; },
  set lives(v){ lives=v; },
  get tangled(){ return tangled; },
  get charging(){ return Math.hypot(roomba.x-DOCK.x, roomba.y-DOCK.y) < DOCK.r+10; },
};

// ---- main loop ----
const params=new URLSearchParams(location.search);
const shot=params.get('shot');
if(shot) stageShot(shot);
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
